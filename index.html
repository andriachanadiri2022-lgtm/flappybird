<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b35">
  <meta name="description" content="ითამაშე პატარა Flappy Bird-ის შთაგონებით შექმნილი თამაში ქართულად.">
  <title>ფრთების რხევა — Flappy Bird</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: #101b35;
      color: #f7f8ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #a7b4d3;
      --gold: #ffd166;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px 16px;
      background:
        radial-gradient(ellipse at 50% 10%, #24345c 0, transparent 48%),
        #101b35;
    }

    .game { width: min(100%, 480px); text-align: center; }

    .brand {
      margin: 0 0 5px;
      color: var(--gold);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.8rem, 7vw, 2.5rem); }

    .subtitle { margin: 8px 0 20px; color: var(--muted); font-size: .95rem; }

    .board {
      position: relative;
      overflow: hidden;
      border: 1px solid #536385;
      border-radius: 22px;
      background: #8bd7f7;
      box-shadow: 0 22px 70px #050a19a8, 0 0 0 7px #ffffff08;
    }

    canvas { display: block; width: 100%; height: auto; touch-action: manipulation; }

    .score {
      position: absolute;
      z-index: 1;
      top: 18px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
    }

    .score-card {
      min-width: 92px;
      padding: 8px 13px 9px;
      border: 1px solid #ffffff3b;
      border-radius: 13px;
      background: #10213b9c;
      backdrop-filter: blur(8px);
    }

    .score-label { display: block; color: #c5d4e8; font-size: .65rem; font-weight: 800; letter-spacing: .12em; }
    .score-value { display: block; margin-top: 1px; font-size: 1.35rem; font-weight: 900; line-height: 1.2; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: linear-gradient(#13233c22, #13233c67);
      transition: opacity .2s ease;
    }

    .overlay[hidden] { display: none; }

    .panel {
      width: min(100%, 320px);
      padding: 24px 22px;
      border: 1px solid #ffffff42;
      border-radius: 20px;
      background: #101b35e8;
      box-shadow: 0 14px 40px #08112655;
      backdrop-filter: blur(10px);
    }

    .panel h2 { margin: 0 0 8px; font-size: 1.65rem; }
    .panel p { margin: 0 0 18px; color: #c7d2e8; line-height: 1.55; }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      background: var(--gold);
      color: #19213a;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    button:hover { transform: translateY(-2px); background: #ffdf91; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }

    .hint { margin: 15px 0 0; color: var(--muted); font-size: .86rem; }
    .hint strong { color: #fff; }

    @media (max-height: 700px) {
      body { padding-top: 14px; padding-bottom: 14px; }
      .subtitle { margin-bottom: 12px; }
      .board { max-height: calc(100vh - 170px); }
      canvas { max-height: calc(100vh - 170px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game">
    <p class="brand">პატარა არკადა</p>
    <h1>ფრთების რხევა</h1>
    <p class="subtitle">იფრინე მილებს შორის და დაამყარე რეკორდი!</p>
    <section class="board" aria-label="ფრთების რხევის სათამაშო მოედანი">
      <div class="score" aria-live="polite">
        <div class="score-card"><span class="score-label">ქულა</span><span class="score-value" id="score">0</span></div>
        <div class="score-card"><span class="score-label">რეკორდი</span><span class="score-value" id="best">0</span></div>
      </div>
      <canvas id="game" width="432" height="600" aria-label="დაბრკოლებებს შორის ფრენა"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="message-title">მზად ხარ?</h2>
          <p id="message">დააჭირე ღილაკს და გააფრინე ჩიტი მილებს შორის.</p>
          <button id="start" type="button">თამაშის დაწყება</button>
        </div>
      </div>
    </section>
    <p class="hint">ფრთების ასაქნევად დააჭირე <strong>Space</strong>-ს ან შეეხე ეკრანს</p>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const overlay = document.querySelector("#overlay");
      const title = document.querySelector("#message-title");
      const message = document.querySelector("#message");
      const startButton = document.querySelector("#start");
      const scoreLabel = document.querySelector("#score");
      const bestLabel = document.querySelector("#best");
      const width = canvas.width;
      const height = canvas.height;
      const groundHeight = 66;
      const bird = { x: 112, y: 270, radius: 15, velocity: 0, rotation: 0 };
      const pipeWidth = 64;
      const gapHeight = 166;
      const pipes = [];
      let score = 0;
      let best = loadBest();
      let state = "ready";
      let lastFrame = 0;
      let elapsed = 0;
      let groundOffset = 0;

      bestLabel.textContent = String(best);

      function loadBest() {
        try {
          return Number(localStorage.getItem("wingbeat-best")) || 0;
        } catch {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem("wingbeat-best", String(best));
        } catch {
          // The current session's score remains available if storage is disabled.
        }
      }

      function cloud(x, y, scale) {
        ctx.fillStyle = "#ffffffa8";
        ctx.beginPath();
        ctx.arc(x, y, 20 * scale, 0, Math.PI * 2);
        ctx.arc(x + 24 * scale, y - 9 * scale, 25 * scale, 0, Math.PI * 2);
        ctx.arc(x + 52 * scale, y, 19 * scale, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#83d6f3");
        sky.addColorStop(1, "#d2f4d0");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = "#fff1a8";
        ctx.beginPath();
        ctx.arc(345, 112, 36, 0, Math.PI * 2);
        ctx.fill();

        cloud(43, 143, .8);
        cloud(265, 235, .62);
        cloud(154, 86, .5);

        ctx.fillStyle = "#a6dbac";
        ctx.beginPath();
        ctx.moveTo(0, height - groundHeight - 36);
        ctx.quadraticCurveTo(110, 405, 215, 480);
        ctx.quadraticCurveTo(325, 408, width, 450);
        ctx.lineTo(width, height - groundHeight);
        ctx.lineTo(0, height - groundHeight);
        ctx.fill();
      }

      function drawPipes() {
        pipes.forEach((pipe) => {
          const top = pipe.gapY - gapHeight / 2;
          const bottom = pipe.gapY + gapHeight / 2;
          const gradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipeWidth, 0);
          gradient.addColorStop(0, "#348a55");
          gradient.addColorStop(.24, "#67c96c");
          gradient.addColorStop(1, "#328751");
          ctx.fillStyle = gradient;
          ctx.strokeStyle = "#286d46";
          ctx.lineWidth = 3;
          ctx.fillRect(pipe.x, 0, pipeWidth, top - 15);
          ctx.strokeRect(pipe.x, -2, pipeWidth, top - 13);
          ctx.fillRect(pipe.x, bottom + 15, pipeWidth, height - groundHeight - bottom);
          ctx.strokeRect(pipe.x, bottom + 14, pipeWidth, height - groundHeight - bottom);
          ctx.fillStyle = "#55b963";
          ctx.fillRect(pipe.x - 5, top - 16, pipeWidth + 10, 17);
          ctx.strokeRect(pipe.x - 5, top - 16, pipeWidth + 10, 17);
          ctx.fillRect(pipe.x - 5, bottom, pipeWidth + 10, 17);
          ctx.strokeRect(pipe.x - 5, bottom, pipeWidth + 10, 17);
        });
      }

      function drawBird() {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rotation);
        ctx.fillStyle = "#f3a82e";
        ctx.strokeStyle = "#bd6c24";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(0, 0, bird.radius + 2, bird.radius, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffe18a";
        ctx.beginPath();
        ctx.ellipse(-5, 5, 9, 6, -.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#d08a30";
        ctx.stroke();

        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(7, -6, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#17233a";
        ctx.beginPath();
        ctx.arc(9, -6, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ee7046";
        ctx.beginPath();
        ctx.moveTo(12, 0);
        ctx.lineTo(25, 4);
        ctx.lineTo(12, 8);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawGround() {
        ctx.fillStyle = "#e8cf85";
        ctx.fillRect(0, height - groundHeight, width, groundHeight);
        ctx.fillStyle = "#72bd55";
        ctx.fillRect(0, height - groundHeight, width, 13);
        ctx.fillStyle = "#91d565";
        for (let x = -22 + groundOffset; x < width; x += 26) {
          ctx.beginPath();
          ctx.moveTo(x, height - groundHeight + 13);
          ctx.lineTo(x + 13, height - groundHeight + 13);
          ctx.lineTo(x + 25, height - groundHeight + 27);
          ctx.lineTo(x + 12, height - groundHeight + 27);
          ctx.fill();
        }
        ctx.fillStyle = "#fff2bd";
        ctx.fillRect(0, height - 9, width, 9);
      }

      function render() {
        drawBackground();
        drawPipes();
        drawGround();
        drawBird();
      }

      function addPipe(x = width + 12) {
        const margin = 100;
        const minY = margin + gapHeight / 2;
        const maxY = height - groundHeight - margin - gapHeight / 2;
        pipes.push({ x, gapY: minY + Math.random() * (maxY - minY), scored: false });
      }

      function reset() {
        score = 0;
        elapsed = 0;
        bird.y = 270;
        bird.velocity = 0;
        bird.rotation = 0;
        pipes.length = 0;
        addPipe(310);
        addPipe(535);
        scoreLabel.textContent = "0";
      }

      function flap() {
        if (state === "ready") startGame();
        if (state !== "playing") return;
        bird.velocity = -390;
      }

      function startGame() {
        reset();
        state = "playing";
        overlay.hidden = true;
        bird.velocity = -310;
        lastFrame = performance.now();
        requestAnimationFrame(frame);
      }

      function endGame() {
        state = "over";
        if (score > best) {
          best = score;
          bestLabel.textContent = String(best);
          saveBest();
        }
        title.textContent = score > 0 ? "კარგი მცდელობა!" : "თამაში დასრულდა";
        message.textContent = `შენი ქულაა ${score}. კიდევ ერთხელ სცადე და რეკორდი გააუმჯობესე!`;
        startButton.textContent = "თავიდან თამაში";
        overlay.hidden = false;
      }

      function collidesWithPipe(pipe) {
        const top = pipe.gapY - gapHeight / 2;
        const bottom = pipe.gapY + gapHeight / 2;
        const birdLeft = bird.x - bird.radius + 3;
        const birdRight = bird.x + bird.radius - 3;
        const overlapsPipe = birdRight > pipe.x && birdLeft < pipe.x + pipeWidth;
        const outsideGap = bird.y - bird.radius < top || bird.y + bird.radius > bottom;
        return overlapsPipe && outsideGap;
      }

      function frame(now) {
        if (state !== "playing") return;
        const delta = Math.min((now - lastFrame) / 1000, .035);
        lastFrame = now;
        elapsed += delta;
        bird.velocity += 1180 * delta;
        bird.y += bird.velocity * delta;
        bird.rotation = Math.min(Math.PI / 3, Math.max(-.45, bird.velocity / 650));
        groundOffset = (groundOffset - 120 * delta) % 26;

        const speed = 158 + Math.min(score * 2, 54);
        pipes.forEach((pipe) => {
          pipe.x -= speed * delta;
          if (!pipe.scored && pipe.x + pipeWidth < bird.x) {
            pipe.scored = true;
            score += 1;
            scoreLabel.textContent = String(score);
          }
        });
        if (pipes[pipes.length - 1].x < width - 220) addPipe();
        while (pipes.length && pipes[0].x + pipeWidth < -10) pipes.shift();

        if (bird.y - bird.radius < 0 ||
            bird.y + bird.radius > height - groundHeight ||
            pipes.some(collidesWithPipe)) {
          render();
          endGame();
          return;
        }

        render();
        requestAnimationFrame(frame);
      }

      startButton.addEventListener("click", startGame);
      canvas.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        flap();
      });
      window.addEventListener("keydown", (event) => {
        if (event.code === "Space" || event.code === "ArrowUp") {
          event.preventDefault();
          flap();
        }
        if (event.code === "Enter" && state !== "playing") startGame();
      });

      reset();
      bird.y = 285 + Math.sin(performance.now() / 450) * 7;
      render();
      setInterval(() => {
        if (state === "ready") {
          bird.y = 285 + Math.sin(performance.now() / 450) * 7;
          render();
        }
      }, 40);
    })();
  </script>
</body>
</html>
